name: Flyway migrations

on:
  pull_request:
    paths:
      - 'helpTree-service/src/main/resources/db/migration/**'
      - 'scripts/fixtures/**'
      - 'helpTree-service/pom.xml'
      - 'pom.xml'
      - '.github/workflows/flyway-migrations.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'helpTree-service/src/main/resources/db/migration/**'
      - 'scripts/fixtures/**'
      - 'helpTree-service/pom.xml'
      - 'pom.xml'
      - '.github/workflows/flyway-migrations.yml'

permissions:
  contents: read

env:
  DB_URL: jdbc:postgresql://localhost:5432/helpTree_db
  DB_USER: helpTree
  DB_PASS: helpTree
  PGHOST: localhost
  PGPORT: 5432
  PGUSER: helpTree
  PGPASSWORD: helpTree
  PGDATABASE: helpTree_db

jobs:
  clean-database:
    name: Migrate and validate a clean database
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helpTree
          POSTGRES_PASSWORD: helpTree
          POSTGRES_DB: helpTree_db
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U helpTree"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # flyway:validate cannot succeed before the history table exists: every
      # resolved migration is legitimately "pending". The clean-database proof is
      # that migrate succeeds from an empty schema, followed by validate.
      - name: Apply all migrations
        run: ./mvnw -B -pl helpTree-service flyway:migrate

      - name: Validate applied history
        run: ./mvnw -B -pl helpTree-service flyway:validate

      - name: Verify schema contract
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block6_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block7_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block8_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block9_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block10_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block11_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block12_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block14_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block15_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block16_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block17_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block19_schema.sql

  legacy-data-copy:
    name: Migrate a V40 data copy
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helpTree
          POSTGRES_PASSWORD: helpTree
          POSTGRES_DB: helpTree_db
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U helpTree"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Apply migrations up to V40
        run: ./mvnw -B -pl helpTree-service flyway:migrate -Dflyway.target=40

      - name: Load representative legacy data
        run: psql -v ON_ERROR_STOP=1 -f scripts/fixtures/legacy_v40_data.sql

      - name: Apply remaining migrations
        run: ./mvnw -B -pl helpTree-service flyway:migrate

      - name: Validate applied history
        run: ./mvnw -B -pl helpTree-service flyway:validate

      - name: Verify schema, preserved data and constraints
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block6_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block6_legacy.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block6_constraints.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block7_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block8_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block9_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block10_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block11_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block12_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block14_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block15_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block16_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block17_schema.sql
          psql -v ON_ERROR_STOP=1 -f scripts/fixtures/verify_block19_schema.sql
