global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    application: helpTree-app
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: helpTree-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8081
        labels:
          application: helpTree-app
          environment: production
    basic_auth:
      username: prometheus
      password_file: /run/secrets/prometheus_scrape_password
