services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: helpTree_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - helpTree-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpTree"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus_helpTree
    restart: unless-stopped
    volumes:
      - ./helpTree-service/src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    environment:
      PROMETHEUS_SCRAPE_USERNAME: ${PROMETHEUS_SCRAPE_USERNAME:?Set PROMETHEUS_SCRAPE_USERNAME in .env}
      PROMETHEUS_SCRAPE_PASSWORD: ${PROMETHEUS_SCRAPE_PASSWORD:?Set PROMETHEUS_SCRAPE_PASSWORD in .env}
      PROMETHEUS_TARGET: "${PROMETHEUS_TARGET:-host.docker.internal:8080}"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--config.expand-env'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - '9090:9090'
    networks:
      - helpTree-network
    depends_on:
      - postgres
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager_helpTree
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - '9093:9093'
    networks:
      - helpTree-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana_helpTree
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # No default administrator password: a shared "admin/admin" login is a
      # critical finding, even in a development dashboard.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_INSTALL_PLUGINS: ""
      GF_UPDATE_CHECKER_ENABLED: false
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    networks:
      - helpTree-network
    volumes:
      - grafana_data:/var/lib/grafana

  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # UI
      - "6831:6831/udp"  # Jaeger agent (thrift compact)
      - "14268:14268"  # Jaeger collector (HTTP)
      - "4317:4317"  # OTLP receiver (gRPC)
      - "4318:4318"  # OTLP receiver (HTTP)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
    networks:
      - helpTree-network
    volumes:
      - jaeger_data:/var/lib/jaeger
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:16686" ]
      interval: 10s
      timeout: 5s
      retries: 5

  silo:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: helptree-silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # No fallback credentials. Export both values in .env so the storage
      # account is never a well-known default.
      MINIO_ROOT_USER: ${SILO_ACCESS_KEY:?Set SILO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${SILO_SECRET_KEY:?Set SILO_SECRET_KEY in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - silo_data:/data
    networks:
      - helpTree-network

volumes:
  postgres_data:
    name: helpTree_postgres_data
  prometheus_data:
    name: helpTree_prometheus_data
  alertmanager_data:
    name: helpTree_alertmanager_data
  grafana_data:
    name: helpTree_grafana_data
  jaeger_data:
    name: helpTree_jaeger_data
  silo_data:
    name: helpTree_silo_data

networks:
  helpTree-network:
    name: helpTree-network
    driver: bridge