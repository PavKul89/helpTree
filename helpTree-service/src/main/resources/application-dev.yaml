server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: helpTree
  main:
    allow-bean-definition-overriding: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # Database, JWT, administrator and Silo credentials are not defaulted here.
  # Export them (see .env.example / scripts/run-dev.ps1) so a local run uses the
  # same explicit configuration path as production.
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: disabled
      password: disabled

  flyway:
    enabled: true
    baseline-on-migrate: true

# ======================================================
# ТРАССИРОВКА (dev)
# ======================================================
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    mdc:
      field-names:
        - traceId
        - spanId
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          protocol: http/protobuf
  metrics:
    export:
      otlp:
        enabled: false
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        helptree.api.duration: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - info
          - prometheus
          - loggers
          - tracing

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
    org.example.helptreeservice: DEBUG
    io.micrometer.tracing: DEBUG
    io.opentelemetry: DEBUG
    io.opentelemetry.exporter.otlp: DEBUG
