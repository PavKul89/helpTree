server:
  port: 8080

spring:
  application:
    name: helpTree
  main:
    allow-bean-definition-overriding: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpTree_db}
    username: ${DB_USER:helpTree}
    password: ${DB_PASS:helpTree}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: disabled
      password: disabled

  flyway:
    enabled: true
    baseline-on-migrate: true

# ======================================================
# ТРАССИРОВКА
# ======================================================
management:
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
    mdc:
      field-names:
        - traceId
        - spanId
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          protocol: http/protobuf
  metrics:
    export:
      otlp:
        enabled: false
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - info
          - prometheus
          - loggers

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.example.helptreeservice: INFO
    io.micrometer.tracing: WARN
    io.opentelemetry: WARN
    io.opentelemetry.exporter.otlp: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %green([HELPTREE]) %X{traceId} %X{spanId} %X{requestId} %X{userId} %cyan(%logger{36}) - %msg%n"



app:
  jwtSecret: ${JWT_SECRET:dev-only-secret-not-for-production-64chars-minimum-length!!}
  jwtExpirationMs: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@helptree.dev}
    password: ${ADMIN_PASSWORD:dev-admin-password-change-in-prod}
  economy:
    coins-per-help: 10
    coins-per-help-received: 2
    coins-per-review: 2
    coins-per-daily-login: 1
    first-help-bonus: 3
    boost-price: 5
    boost-hours: 24
    refresh-token-days: 7
    debt-block-threshold: 5
    debt-warning-threshold: 3
    debt-create-post-threshold: 2
  rate-limit:
    enabled: true
    default-limit: 1000
    auth-limit: 100
    create-limit: 50
    window-seconds: 60

upload:
  max-size: 10485760  # 10MB в байтах
  allowed-types: image/jpeg,image/png,image/webp,image/gif
  dir: uploads

resilience4j:
  ratelimiter:
    configs:
      default:
        limitForPeriod: 1000
        limitRefreshPeriod: 60s
        timeoutDuration: 1000ms
      auth:
        limitForPeriod: 100
        limitRefreshPeriod: 60s
        timeoutDuration: 1000ms
      create:
        limitForPeriod: 50
        limitRefreshPeriod: 60s
        timeoutDuration: 1000ms