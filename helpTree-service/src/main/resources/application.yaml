server:
  port: 8080
  # JSON is highly compressible; small responses are left alone to avoid the
  # CPU/header overhead. Proxies may also compress, but enabling it here keeps
  # direct clients and the local dev setup fast.
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: ${SERVER_COMPRESSION_MIN_SIZE:1024}

spring:
  application:
    name: helpTree
  main:
    allow-bean-definition-overriding: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    # No fallback credentials. A local run uses the `dev` profile, which
    # supplies development-only values; production must provide these variables.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      # One pool per instance. Keep it well below PostgreSQL's max_connections
      # divided by the expected instance count.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      # 0 disables leak logging; enable temporarily when diagnosing a leak.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
        jdbc:
          # Applies to every JDBC statement, including ad-hoc native queries.
          timeout: ${DB_QUERY_TIMEOUT_SECONDS:30}
      jakarta:
        persistence:
          # Query-level hint used by derived/native Spring Data queries.
          query.timeout: ${DB_QUERY_TIMEOUT_MS:30000}

  security:
    user:
      name: disabled
      password: disabled

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  # SMTP for account security emails. Delivery is controlled by app.mail.enabled.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

# API documentation is opt-in outside local development.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# ======================================================
# ТРАССИРОВКА
# ======================================================
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  health:
    # SMTP is optional. Without this switch Spring Boot's MailHealthIndicator
    # probes localhost:25 and marks the whole application DOWN when mail is disabled.
    mail:
      enabled: ${MAIL_ENABLED:false}
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
    mdc:
      field-names:
        - traceId
        - spanId
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          protocol: http/protobuf
  metrics:
    export:
      otlp:
        enabled: false
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        # Custom API timer so the latency alert can use a p95 quantile instead
        # of an average that hides a slow tail.
        helptree.api.duration: true
  endpoint:
    health:
      # Public health returns only the aggregate status. Component details are
      # visible to an authenticated administrator.
      show-details: when_authorized
      show-components: never
      roles: ADMIN
      probes:
        enabled: true
    info:
      enabled: true
  info:
    env:
      enabled: true
    app:
      name: ${spring.application.name}
      version: ${info.app.version:unknown}
  endpoints:
    web:
      exposure:
        # Exposure only makes an endpoint reachable; access is decided by
        # SecurityConfig. Keep this allow-list explicit, never "*".
        include:
          - health
          - metrics
          - info
          - prometheus
        exclude:
          - env
          - configprops
          - heapdump
          - threaddump
          - shutdown

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.example.helptreeservice: INFO
    io.micrometer.tracing: WARN
    io.opentelemetry: WARN
    io.opentelemetry.exporter.otlp: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %green([HELPTREE]) %X{traceId} %X{spanId} %X{requestId} %X{userId} %cyan(%logger{36}) - %msg%n"



app:
  api:
    # Advertised in OpenAPI and the X-API-Version header. A breaking change
    # moves to /api/v2 while the previous version stays available; see
    # docs/API_CONTRACT.md.
    version: ${API_VERSION:1}
  # No fallback. ProductionConfigValidator additionally rejects known
  # development values and secrets shorter than 64 characters in prod.
  jwtSecret: ${JWT_SECRET}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}
  auth:
    password-reset-token-minutes: ${PASSWORD_RESET_TOKEN_MINUTES:30}
    email-verification-token-hours: ${EMAIL_VERIFICATION_TOKEN_HOURS:24}
    email-change-token-hours: ${EMAIL_CHANGE_TOKEN_HOURS:24}
    session-touch-minutes: ${SESSION_TOUCH_MINUTES:1}
    # Activity timestamp is written at most once per this many minutes.
    last-seen-touch-minutes: ${LAST_SEEN_TOUCH_MINUTES:1}
    # "Online" means last activity within this window.
    online-window-minutes: ${ONLINE_WINDOW_MINUTES:5}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    ws-ticket-seconds: ${WS_TICKET_SECONDS:60}
  chat:
    max-message-length: ${CHAT_MAX_MESSAGE_LENGTH:5000}
    rate-limit-enabled: ${CHAT_RATE_LIMIT_ENABLED:true}
    messages-per-minute: ${CHAT_MESSAGES_PER_MINUTE:30}
    cursor-default-limit: ${CHAT_CURSOR_DEFAULT_LIMIT:20}
    cursor-max-limit: ${CHAT_CURSOR_MAX_LIMIT:100}
    # Sender edit window and attachment limit.
    edit-window-minutes: ${CHAT_EDIT_WINDOW_MINUTES:15}
    max-attachments: ${CHAT_MAX_ATTACHMENTS:3}
    # 0 disables physical retention. Messages older than this many days are
    # deleted in batches; see docs/OPERATIONS.md.
    retention-days: ${CHAT_RETENTION_DAYS:90}
    retention-cron: "${CHAT_RETENTION_CRON:0 30 3 * * *}"
    retention-batch-size: ${CHAT_RETENTION_BATCH_SIZE:500}
    retention-max-batches-per-run: ${CHAT_RETENTION_MAX_BATCHES_PER_RUN:20}
    # Legacy /topic destinations remain authorized for older frontend builds.
    # Disable after the frontend has fully moved to /user/queue destinations.
    legacy-topics-enabled: ${CHAT_LEGACY_TOPICS_ENABLED:true}
  comments:
    max-length: ${COMMENT_MAX_LENGTH:1000}
    max-depth: ${COMMENT_MAX_DEPTH:3}
    rate-limit-enabled: ${COMMENT_RATE_LIMIT_ENABLED:true}
    per-minute: ${COMMENT_PER_MINUTE:10}
    default-page-size: 20
    max-page-size: 100
  notifications:
    # Global switch. When false no notification row and no outbox intent is written.
    enabled: ${NOTIFICATIONS_ENABLED:true}
    dispatch-cron: "${NOTIFICATIONS_DISPATCH_CRON:0 * * * * *}"
    batch-size: ${NOTIFICATIONS_BATCH_SIZE:50}
    max-batches-per-run: ${NOTIFICATIONS_MAX_BATCHES_PER_RUN:10}
    max-attempts: ${NOTIFICATIONS_MAX_ATTEMPTS:5}
    retry-base-seconds: ${NOTIFICATIONS_RETRY_BASE_SECONDS:30}
    retry-max-seconds: ${NOTIFICATIONS_RETRY_MAX_SECONDS:3600}
    processing-timeout-minutes: ${NOTIFICATIONS_PROCESSING_TIMEOUT_MINUTES:10}
    # Telegram stays disabled while the token is blank.
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
  moderation:
    # Restores content hidden by a temporary HIDE_CONTENT action.
    expiry-cron: "${MODERATION_EXPIRY_CRON:0 5 * * * *}"
  help:
    # Stale ACCEPTED helps are cancelled after this many hours (default 7 days).
    sla-enabled: ${HELP_SLA_ENABLED:true}
    accepted-timeout-hours: ${HELP_ACCEPTED_TIMEOUT_HOURS:168}
    sla-cron: "${HELP_SLA_CRON:0 0 * * * *}"
    sla-batch-size: ${HELP_SLA_BATCH_SIZE:100}
    # Reminders are sent at 50% and 80% of the same timeout.
    reminders-enabled: ${HELP_REMINDERS_ENABLED:true}
    reminder-first-percent: ${HELP_REMINDER_FIRST_PERCENT:50}
    reminder-second-percent: ${HELP_REMINDER_SECOND_PERCENT:80}
    reminder-cron: "${HELP_REMINDER_CRON:0 0 * * * *}"
    reminder-batch-size: ${HELP_REMINDER_BATCH_SIZE:200}
  posts:
    # Server-side link policy for titles and descriptions.
    max-links: ${POST_MAX_LINKS:5}
    # Identical title+description by the same author inside this window is 409.
    # 0 disables the duplicate guard.
    duplicate-window-hours: ${POST_DUPLICATE_WINDOW_HOURS:24}
  partitions:
    # Rolling monthly partitions for messages/outbox_events. The window is
    # created ahead of time; a write must never depend on the default partition.
    enabled: ${PARTITIONS_ENABLED:true}
    cron: "${PARTITIONS_CRON:0 15 3 * * *}"
    future-months: ${PARTITIONS_FUTURE_MONTHS:3}
    # Drops whole months past retention. Messages additionally honour
    # CHAT_RETENTION_DAYS, so a longer chat policy always wins.
    drop-old-partitions: ${PARTITIONS_DROP_OLD:true}
    retention-months: ${PARTITIONS_RETENTION_MONTHS:24}
  antivirus:
    # ClamAV INSTREAM. Disabled by default; when enabled the upload path is
    # fail-closed (scanner unreachable -> 503, infected file -> 400).
    enabled: ${ANTIVIRUS_ENABLED:false}
    host: ${ANTIVIRUS_HOST:localhost}
    port: ${ANTIVIRUS_PORT:3310}
    connect-timeout-millis: ${ANTIVIRUS_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${ANTIVIRUS_READ_TIMEOUT_MILLIS:10000}
    chunk-size: ${ANTIVIRUS_CHUNK_SIZE:65536}
  wallet:
    # The export is one response; a larger history must be narrowed by filters.
    export-max-rows: ${WALLET_EXPORT_MAX_ROWS:50000}
    # VIP reminder days before expiry and the daily sweep.
    vip-reminder-days: ${WALLET_VIP_REMINDER_DAYS:7,3,1}
    vip-reminder-cron: "${WALLET_VIP_REMINDER_CRON:0 0 10 * * *}"
    vip-reminder-batch-size: ${WALLET_VIP_REMINDER_BATCH_SIZE:500}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
    relay-enabled: ${WS_RELAY_ENABLED:false}
    relay-host: ${WS_RELAY_HOST:localhost}
    relay-port: ${WS_RELAY_PORT:61613}
    # Relay credentials have no default. They are required only when the relay
    # is enabled (see ProductionConfigValidator).
    client-login: ${WS_RELAY_CLIENT_LOGIN:}
    client-passcode: ${WS_RELAY_CLIENT_PASSCODE:}
    system-login: ${WS_RELAY_SYSTEM_LOGIN:}
    system-passcode: ${WS_RELAY_SYSTEM_PASSCODE:}
    heartbeat-seconds: ${WS_HEARTBEAT_SECONDS:10}
  mail:
    # Email flows stay disabled until SMTP is configured. Never log or return tokens.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@helptree.local}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
  admin:
    # The first administrator is created only by the explicit one-time
    # bootstrap below. When disabled (the default) the application starts
    # without an administrator and warns if none exists.
    bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  features:
    # Cross-cutting toggles. A disabled feature fails closed: its endpoints
    # answer 503 FEATURE_DISABLED instead of silently behaving differently.
    # NOTIFICATIONS_ENABLED is shared with app.notifications.enabled.
    reports: ${FEATURE_REPORTS_ENABLED:true}
    notifications: ${NOTIFICATIONS_ENABLED:true}
    user-blocks: ${FEATURE_USER_BLOCKS_ENABLED:true}
    moderation: ${FEATURE_MODERATION_ENABLED:true}
  metrics:
    # Queue/SLA/balance gauges are refreshed by one bounded scheduler query
    # set, not by every scrape.
    refresh-ms: ${METRICS_REFRESH_MS:60000}
    initial-delay-ms: ${METRICS_INITIAL_DELAY_MS:15000}
    prometheus:
      username: ${PROMETHEUS_SCRAPE_USERNAME:prometheus}
      password: ${PROMETHEUS_SCRAPE_PASSWORD:}
  reports:
    # A report older than this marks an SLA breach in the moderation metric.
    sla-hours: ${REPORTS_SLA_HOURS:24}
  pagination:
    default-page-size: 20
    max-page-size: 100
  graph:
    # Hard server-side bounds. A request can lower these but never exceed them.
    default-max-edges: ${GRAPH_DEFAULT_MAX_EDGES:500}
    max-edges: ${GRAPH_MAX_EDGES:2000}
    max-depth: ${GRAPH_MAX_DEPTH:10}
  geocoding:
    # Requests only read the durable cache; the scheduled worker performs the
    # rate-limited Nominatim call. The interval doubles as the rate limit.
    enabled: ${GEOCODING_ENABLED:true}
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org/search}
    user-agent: ${GEOCODING_USER_AGENT:HelpTree/1.0 (Java Backend)}
    country-code: ${GEOCODING_COUNTRY_CODE:by}
    worker-interval-ms: ${GEOCODING_WORKER_INTERVAL_MS:1100}
    batch-size: ${GEOCODING_BATCH_SIZE:1}
    max-attempts: ${GEOCODING_MAX_ATTEMPTS:5}
    stale-minutes: ${GEOCODING_STALE_MINUTES:30}
  economy:
    coins-per-help: 10
    coins-per-help-received: 2
    coins-per-review: 2
    coins-per-daily-login: 1
    first-help-bonus: 3
    # Server-side price catalog. Clients never send prices.
    boost-price: ${ECONOMY_BOOST_PRICE:5}
    boost-hours: ${ECONOMY_BOOST_HOURS:24}
    boost-cleanup-cron: "${ECONOMY_BOOST_CLEANUP_CRON:0 15 * * * *}"
    vip-price: ${ECONOMY_VIP_PRICE:50}
    vip-days: ${ECONOMY_VIP_DAYS:30}
    nickname-color-price: ${ECONOMY_NICKNAME_COLOR_PRICE:20}
    account-unblock-price: ${ECONOMY_ACCOUNT_UNBLOCK_PRICE:100}
    account-unblock-debt-reduction: ${ECONOMY_ACCOUNT_UNBLOCK_DEBT_REDUCTION:5}
    # Daily bonus resets at 00:00 in this zone.
    daily-bonus-zone: ${ECONOMY_DAILY_BONUS_ZONE:Europe/Moscow}
    admin-max-coins-per-operation: ${ECONOMY_ADMIN_MAX_COINS:1000000}
    idempotency-key-max-length: ${ECONOMY_IDEMPOTENCY_KEY_MAX_LENGTH:100}
    reconciliation-enabled: ${ECONOMY_RECONCILIATION_ENABLED:true}
    reconciliation-cron: "${ECONOMY_RECONCILIATION_CRON:0 0 4 * * *}"
    refresh-token-days: 7
    debt-block-threshold: ${ECONOMY_DEBT_BLOCK_THRESHOLD:5}
    debt-warning-threshold: ${ECONOMY_DEBT_WARNING_THRESHOLD:3}
    debt-create-post-threshold: ${ECONOMY_DEBT_CREATE_POST_THRESHOLD:2}
    debt-per-received-help: ${ECONOMY_DEBT_PER_HELP:2}
    debt-clear-threshold: ${ECONOMY_DEBT_CLEAR_THRESHOLD:2}
    debt-block-days: ${ECONOMY_DEBT_BLOCK_DAYS:7}
  # Shared, database-backed request limits and login lockout (Block 12).
  # Counters are keyed by route + client IP + authenticated account, so
  # instances agree and users behind one proxy do not share an account bucket.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    default-limit: ${RATE_LIMIT_DEFAULT:600}
    auth-limit: ${RATE_LIMIT_AUTH:60}
    login-limit: ${RATE_LIMIT_LOGIN:10}
    register-limit: ${RATE_LIMIT_REGISTER:5}
    password-reset-limit: ${RATE_LIMIT_PASSWORD_RESET:5}
    upload-limit: ${RATE_LIMIT_UPLOAD:20}
    create-limit: ${RATE_LIMIT_CREATE:60}
    cleanup-cron: "${RATE_LIMIT_CLEANUP_CRON:0 */5 * * * *}"
    cleanup-batch-size: ${RATE_LIMIT_CLEANUP_BATCH_SIZE:1000}
  # Failures are counted per (IP, account); a lock expires automatically.
  login-protection:
    enabled: ${LOGIN_PROTECTION_ENABLED:true}
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    failure-window-minutes: ${LOGIN_FAILURE_WINDOW_MINUTES:15}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}

rating:
  calculation:
    batch-size: ${RATING_CALCULATION_BATCH_SIZE:100}
    cron: "${RATING_CALCULATION_CRON:0 0/5 * * * ?}"
  history:
    # Retention and batch size are independent: retention decides what may be
    # deleted, the batch bounds one transaction.
    retention-days: ${RATING_HISTORY_RETENTION_DAYS:365}
    cleanup-batch-size: ${RATING_HISTORY_CLEANUP_BATCH_SIZE:1000}
    max-batches-per-run: ${RATING_HISTORY_MAX_BATCHES_PER_RUN:1000}
    cleanup-cron: "${RATING_HISTORY_CLEANUP_CRON:0 0 2 * * ?}"

upload:
  # Server-side limits. The client never supplies these values.
  max-size: ${UPLOAD_MAX_SIZE:10485760}
  max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:52428800}
  max-files: ${UPLOAD_MAX_FILES:10}
  # Read before a full decode, so a compressed decompression bomb is rejected
  # without allocating its pixel buffer.
  max-width: ${UPLOAD_MAX_WIDTH:6000}
  max-height: ${UPLOAD_MAX_HEIGHT:6000}
  max-pixels: ${UPLOAD_MAX_PIXELS:24000000}
  jpeg-quality: ${UPLOAD_JPEG_QUALITY:0.85}
  gif-max-frames: ${UPLOAD_GIF_MAX_FRAMES:200}
  gif-max-total-pixels: ${UPLOAD_GIF_MAX_TOTAL_PIXELS:100000000}
  # Per-user quota across all active objects (avatars and post images).
  quota-bytes: ${UPLOAD_QUOTA_BYTES:104857600}
  quota-count: ${UPLOAD_QUOTA_COUNT:500}
  cleanup:
    enabled: ${IMAGE_CLEANUP_ENABLED:true}
    cron: "${IMAGE_CLEANUP_CRON:0 30 3 * * *}"
    # Younger objects may still be between Silo upload and DB registration.
    orphan-ttl-hours: ${IMAGE_CLEANUP_ORPHAN_TTL_HOURS:24}
    batch-size: ${IMAGE_CLEANUP_BATCH_SIZE:100}
    max-batches-per-run: ${IMAGE_CLEANUP_MAX_BATCHES_PER_RUN:20}
    # Objects in the bucket without any ownership row. Disable when the bucket
    # is shared with another application.
    bucket-scan-enabled: ${IMAGE_CLEANUP_BUCKET_SCAN_ENABLED:true}
    bucket-scan-max-objects: ${IMAGE_CLEANUP_BUCKET_SCAN_MAX_OBJECTS:1000}

silo:
  # No fallback credentials. The dev profile supplies local-only values.
  endpoint: ${SILO_ENDPOINT}
  public-endpoint: ${SILO_PUBLIC_ENDPOINT}
  access-key: ${SILO_ACCESS_KEY}
  secret-key: ${SILO_SECRET_KEY}
  bucket: ${SILO_BUCKET:helptree-images}