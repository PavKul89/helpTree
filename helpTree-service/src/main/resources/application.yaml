server:
  port: 8080

spring:
  application:
    name: helpTree
  main:
    allow-bean-definition-overriding: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpTree_db}
    username: ${DB_USER:helpTree}
    password: ${DB_PASS:helpTree}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: disabled
      password: disabled

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  # SMTP for account security emails. Delivery is controlled by app.mail.enabled.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

# ======================================================
# ТРАССИРОВКА
# ======================================================
management:
  health:
    # SMTP is optional. Without this switch Spring Boot's MailHealthIndicator
    # probes localhost:25 and marks the whole application DOWN when mail is disabled.
    mail:
      enabled: ${MAIL_ENABLED:false}
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
    mdc:
      field-names:
        - traceId
        - spanId
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          protocol: http/protobuf
  metrics:
    export:
      otlp:
        enabled: false
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - info
          - prometheus
          - loggers

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.example.helptreeservice: INFO
    io.micrometer.tracing: WARN
    io.opentelemetry: WARN
    io.opentelemetry.exporter.otlp: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %green([HELPTREE]) %X{traceId} %X{spanId} %X{requestId} %X{userId} %cyan(%logger{36}) - %msg%n"



app:
  jwtSecret: ${JWT_SECRET:dev-only-secret-not-for-production-64chars-minimum-length!!}
  jwtExpirationMs: 86400000
  auth:
    password-reset-token-minutes: ${PASSWORD_RESET_TOKEN_MINUTES:30}
    email-verification-token-hours: ${EMAIL_VERIFICATION_TOKEN_HOURS:24}
    email-change-token-hours: ${EMAIL_CHANGE_TOKEN_HOURS:24}
    session-touch-minutes: ${SESSION_TOUCH_MINUTES:1}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    ws-ticket-seconds: ${WS_TICKET_SECONDS:60}
  chat:
    max-message-length: ${CHAT_MAX_MESSAGE_LENGTH:5000}
    rate-limit-enabled: ${CHAT_RATE_LIMIT_ENABLED:true}
    messages-per-minute: ${CHAT_MESSAGES_PER_MINUTE:30}
    cursor-default-limit: ${CHAT_CURSOR_DEFAULT_LIMIT:20}
    cursor-max-limit: ${CHAT_CURSOR_MAX_LIMIT:100}
    # Legacy /topic destinations remain authorized for older frontend builds.
    # Disable after the frontend has fully moved to /user/queue destinations.
    legacy-topics-enabled: ${CHAT_LEGACY_TOPICS_ENABLED:true}
  help:
    # Stale ACCEPTED helps are cancelled after this many hours (default 7 days).
    sla-enabled: ${HELP_SLA_ENABLED:true}
    accepted-timeout-hours: ${HELP_ACCEPTED_TIMEOUT_HOURS:168}
    sla-cron: "${HELP_SLA_CRON:0 0 * * * *}"
    sla-batch-size: ${HELP_SLA_BATCH_SIZE:100}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
    relay-enabled: ${WS_RELAY_ENABLED:false}
    relay-host: ${WS_RELAY_HOST:localhost}
    relay-port: ${WS_RELAY_PORT:61613}
    client-login: ${WS_RELAY_CLIENT_LOGIN:guest}
    client-passcode: ${WS_RELAY_CLIENT_PASSCODE:guest}
    system-login: ${WS_RELAY_SYSTEM_LOGIN:guest}
    system-passcode: ${WS_RELAY_SYSTEM_PASSCODE:guest}
    heartbeat-seconds: ${WS_HEARTBEAT_SECONDS:10}
  mail:
    # Email flows stay disabled until SMTP is configured. Never log or return tokens.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@helptree.local}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@helptree.dev}
    password: ${ADMIN_PASSWORD:dev-admin-password-change-in-prod}
  pagination:
    default-page-size: 20
    max-page-size: 100
  economy:
    coins-per-help: 10
    coins-per-help-received: 2
    coins-per-review: 2
    coins-per-daily-login: 1
    first-help-bonus: 3
    # Server-side price catalog. Clients never send prices.
    boost-price: ${ECONOMY_BOOST_PRICE:5}
    boost-hours: ${ECONOMY_BOOST_HOURS:24}
    boost-cleanup-cron: "${ECONOMY_BOOST_CLEANUP_CRON:0 15 * * * *}"
    vip-price: ${ECONOMY_VIP_PRICE:50}
    vip-days: ${ECONOMY_VIP_DAYS:30}
    nickname-color-price: ${ECONOMY_NICKNAME_COLOR_PRICE:20}
    account-unblock-price: ${ECONOMY_ACCOUNT_UNBLOCK_PRICE:100}
    account-unblock-debt-reduction: ${ECONOMY_ACCOUNT_UNBLOCK_DEBT_REDUCTION:5}
    # Daily bonus resets at 00:00 in this zone.
    daily-bonus-zone: ${ECONOMY_DAILY_BONUS_ZONE:Europe/Moscow}
    admin-max-coins-per-operation: ${ECONOMY_ADMIN_MAX_COINS:1000000}
    idempotency-key-max-length: ${ECONOMY_IDEMPOTENCY_KEY_MAX_LENGTH:100}
    reconciliation-enabled: ${ECONOMY_RECONCILIATION_ENABLED:true}
    reconciliation-cron: "${ECONOMY_RECONCILIATION_CRON:0 0 4 * * *}"
    refresh-token-days: 7
    debt-block-threshold: ${ECONOMY_DEBT_BLOCK_THRESHOLD:5}
    debt-warning-threshold: ${ECONOMY_DEBT_WARNING_THRESHOLD:3}
    debt-create-post-threshold: ${ECONOMY_DEBT_CREATE_POST_THRESHOLD:2}
    debt-per-received-help: ${ECONOMY_DEBT_PER_HELP:2}
    debt-clear-threshold: ${ECONOMY_DEBT_CLEAR_THRESHOLD:2}
    debt-block-days: ${ECONOMY_DEBT_BLOCK_DAYS:7}
  rate-limit:
    enabled: true
    default-limit: 1000
    auth-limit: 100
    create-limit: 50
    window-seconds: 60

upload:
  max-size: 10485760  # 10MB в байтах
  allowed-types: image/jpeg,image/png,image/webp,image/gif

silo:
  endpoint: ${SILO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${SILO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${SILO_ACCESS_KEY:helptree}
  secret-key: ${SILO_SECRET_KEY:helptree-dev-password-change-me}
  bucket: ${SILO_BUCKET:helptree-images}

resilience4j:
  ratelimiter:
    configs:
      default:
        limitForPeriod: 1000
        limitRefreshPeriod: 60s
        timeoutDuration: 1000ms
      auth:
        limitForPeriod: 100
        limitRefreshPeriod: 60s
        timeoutDuration: 1000ms
      create:
        limitForPeriod: 50
        limitRefreshPeriod: 60s
        timeoutDuration: 1000ms