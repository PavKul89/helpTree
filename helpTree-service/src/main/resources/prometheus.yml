global:
  # Operational alerting needs a fast feedback loop; a 5 minute scrape made the
  # previous configuration unable to observe short outages at all.
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    application: 'helpTree-app'
    environment: 'production'

rule_files:
  - '/etc/prometheus/alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: "helpTree-app"
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['${PROMETHEUS_TARGET}']
        labels:
          application: 'helpTree-app'
          environment: 'production'
    basic_auth:
      username: '${PROMETHEUS_SCRAPE_USERNAME}'
      password: '${PROMETHEUS_SCRAPE_PASSWORD}'
