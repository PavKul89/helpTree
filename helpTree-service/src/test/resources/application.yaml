spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpTree_db}
    username: ${DB_USER:helpTree}
    password: ${DB_PASS:helpTree}
    hikari:
      # The Block 22 concurrency scenarios open many parallel transactions and
      # some inner services use REQUIRES_NEW; a larger pool avoids self-starvation.
      maximum-pool-size: 30
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

app:
  jwtSecret: testSecretKeyForJwtTesting12345678901234567890
  jwtExpirationMs: 86400000
  admin:
    email: admin@helptree.dev
    password: dev-admin-password-change-in-prod
  # Unit tests exercise the services directly; the context-level tests must not
  # depend on shared rate-limit state left behind by another test.
  rate-limit:
    enabled: false
  login-protection:
    enabled: false

silo:
  endpoint: http://localhost:9000
  public-endpoint: http://localhost:9000
  access-key: helptree
  secret-key: test-secret-key
  bucket: helptree-images

upload:
  max-size: 10485760
