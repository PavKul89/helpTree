# Alertmanager routing for helpTree.
#
# This file is a working default that sends every alert to a local webhook.
# Replace the receiver with the organisation's email, Slack, PagerDuty or
# Opsgenie integration before production. Credentials must come from the
# deployment environment, not from this file.
#
# Route design:
#   * critical pages immediately and repeats every hour;
#   * warning is grouped and repeats every four hours;
#   * resolved notifications are always sent so an incident closes cleanly.

global:
  resolve_timeout: 5m

route:
  receiver: default-webhook
  group_by: ['alertname', 'severity', 'component']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: default-webhook
      group_wait: 10s
      repeat_interval: 1h
      continue: false
    - matchers:
        - severity = warning
      receiver: default-webhook
      group_wait: 1m
      repeat_interval: 4h

inhibit_rules:
  # A critical alert on a component suppresses its warnings: the on-call
  # engineer already has the more actionable page.
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'component']

receivers:
  - name: default-webhook
    webhook_configs:
      # Placeholder endpoint. Point this at the incident bridge and remove the
      # comment once the real receiver is configured.
      - url: 'http://host.docker.internal:9099/alertmanager'
        send_resolved: true
        max_alerts: 0
